name: Monitor de empregos na Itália

on:
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Enviar uma prévia no bot de empregos sem marcar vagas como avisadas"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 13 * * *"

permissions:
  contents: write

concurrency:
  group: italy-jobs-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar vagas e alertar o bot de empregos
        env:
          TELEGRAM_JOBS_BOT_TOKEN: ${{ secrets.TELEGRAM_JOBS_BOT_TOKEN }}
          TELEGRAM_JOBS_CHAT_ID: ${{ secrets.TELEGRAM_JOBS_CHAT_ID }}
        run: |
          if [ "${{ inputs.send_test_alert }}" = "true" ]; then
            python scripts/monitor_jobs.py --test-alert
          else
            python scripts/monitor_jobs.py
          fi
      - name: Salvar oportunidades encontradas
        run: |
          git config user.name "Italy Jobs Monitor"
          git config user.email "italy-jobs-monitor@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "chore: atualiza oportunidades de emprego"
          git pull --rebase origin main
          git push
