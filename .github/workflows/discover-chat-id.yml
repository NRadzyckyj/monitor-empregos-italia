name: Descobrir Chat ID do bot de empregos

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Listar chats que iniciaram conversa com o bot
        env:
          TELEGRAM_JOBS_BOT_TOKEN: ${{ secrets.TELEGRAM_JOBS_BOT_TOKEN }}
        run: python scripts/discover_chat_id.py
